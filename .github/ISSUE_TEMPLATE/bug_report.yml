name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. agentmgr add ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Agent Manager version
      description: Output of `agentmgr --version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, Node version and engine
      placeholder: macOS 15.4, Node 22.12, Claude Code 2.1
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From `~/.agentmanager/daemon.log`. Remove tokens, URLs with secrets and anything private.
      render: text
